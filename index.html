<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nerikiri 練り切り</title>
    <meta name="description" content="Plan nerikiri batches: base dough, color portions, filling and shaping, with totals that add up." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nerikiri" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&display=swap" />
    <link rel="stylesheet" href="./styles.css?v=20261102-wizard" />
  </head>
  <body data-view="plan">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><span class="brand-en">Nerikiri</span> <span class="brand-jp">練り切り</span></div>
        <nav class="tabs" aria-label="App sections">
          <button type="button" class="tab" data-go="plan">Calculator</button>
          <button type="button" class="tab" data-go="studio">Recipe Studio</button>
        </nav>
      </div>
    </header>

    <main>
      <!-- Guided setup: one question per screen, shown on the first visit -->
      <section class="view" id="view-wizard" aria-labelledby="wiz-title" hidden>
        <div class="wizard">
          <div class="wiz-progress">
            <span id="wiz-count" class="hint"></span>
            <span class="wiz-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          </div>
          <h1 id="wiz-title" class="wiz-title" tabindex="-1"></h1>
          <p id="wiz-help" class="wiz-help"></p>
          <div id="wiz-body" class="wiz-body"></div>
          <div class="wiz-nav">
            <button type="button" class="text-btn" id="wiz-back">Back</button>
            <button type="button" class="primary-btn" id="wiz-next">Next</button>
          </div>
        </div>
      </section>

      <!-- Calculator -->
      <section class="view" id="view-plan" aria-label="Calculator">
        <div class="layout">
          <aside class="card setup" aria-labelledby="setup-title">
            <h1 id="setup-title" class="display">Plan a batch</h1>

            <div class="group">
              <span class="group-label" id="recipe-label">What are you making?</span>
              <div class="recipe-cards" id="recipe-cards" role="group" aria-labelledby="recipe-label"></div>
            </div>

            <div class="group">
              <label class="group-label" for="pieces-wide">How many pieces?</label>
              <div class="stepper stepper-large">
                <button type="button" class="step-btn" data-step="-1" aria-label="One fewer piece">−</button>
                <input id="pieces-wide" class="num" type="number" inputmode="numeric" min="1" step="1" data-bind="pieces" />
                <button type="button" class="step-btn" data-step="1" aria-label="One more piece">+</button>
              </div>
              <p class="hint num" data-out="piecesLine"></p>
            </div>

            <div class="group">
              <span class="group-label" id="loss-label">Extra dough for handling</span>
              <div class="chips" role="group" aria-labelledby="loss-label">
                <button type="button" class="chip-btn" data-set="loss" data-value="0">0%</button>
                <button type="button" class="chip-btn" data-set="loss" data-value="5">5%</button>
                <button type="button" class="chip-btn" data-set="loss" data-value="10">10%</button>
                <button type="button" class="chip-btn" data-set="loss" data-value="15">15%</button>
              </div>
              <p class="hint">Covers dough lost to coloring, shaping and sticky hands. 10% is a safe start.</p>
            </div>

            <div class="more">
              <button type="button" class="more-toggle" id="more-toggle" aria-expanded="false" aria-controls="options-wide">
                <span>More options</span>
                <span class="hint" data-out="moreSummary"></span>
              </button>
              <div id="options-wide" class="options" hidden></div>
            </div>
          </aside>

          <section class="sheet" aria-label="Prep sheet">
            <div class="phone-header">
              <div class="phone-header-row">
                <label class="title-picker">
                  <span class="title-text" data-out="titleHtml"></span>
                  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
                  <select class="overlay-select" data-bind="recipeId" aria-label="Recipe"></select>
                </label>
                <button type="button" class="glass-circle" id="open-options" aria-label="Batch options">
                  <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h4"></path><path d="M12 17h8"></path><circle cx="10" cy="17" r="2"></circle></svg>
                </button>
              </div>
              <p class="hint num" data-out="piecesLine"></p>
            </div>

            <div class="answers">
              <span class="answers-line" data-out="answersLine"></span>
              <button type="button" class="secondary-btn" id="change-answers">Change</button>
            </div>
            <div class="summary" id="summary"></div>
            <div id="steps" class="steps"></div>
            <div id="totals"></div>
            <div id="minibatch"></div>
          </section>
        </div>

        <div class="pieces-bar glass" aria-label="Batch size">
          <span class="pieces-bar-label" id="pieces-phone-label">Pieces</span>
          <div class="stepper">
            <button type="button" class="step-btn round" data-step="-1" aria-label="One fewer piece">−</button>
            <input class="num" type="number" inputmode="numeric" min="1" step="1" data-bind="pieces" aria-labelledby="pieces-phone-label" />
            <button type="button" class="step-btn round" data-step="1" aria-label="One more piece">+</button>
          </div>
          <label class="pill-select">
            <span class="visually-hidden">Extra dough for handling</span>
            <select data-bind="loss">
              <option value="0">No extra</option>
              <option value="5">+5%</option>
              <option value="10">+10%</option>
              <option value="15">+15%</option>
            </select>
          </label>
        </div>
      </section>

      <!-- Recipe Studio -->
      <section class="view" id="view-studio" aria-label="Recipe Studio" hidden>
        <div class="layout">
          <aside class="card library" aria-labelledby="library-title">
            <h1 id="library-title" class="display">Recipes</h1>
            <div class="chips two" role="group" aria-label="Recipe type">
              <button type="button" class="chip-btn" data-lib="design">Designs</button>
              <button type="button" class="chip-btn" data-lib="base">Base doughs</button>
            </div>
            <button type="button" class="new-btn" id="new-recipe">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
              <span id="new-recipe-label">New design</span>
            </button>
            <div id="library-list" class="library-list"></div>
            <p class="hint device-note">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M10 18h4"></path></svg>
              Recipes save on this device, in this browser.
            </p>
          </aside>

          <form class="editor" id="recipe-form" novalidate></form>
        </div>
      </section>
    </main>

    <nav class="tabbar glass" aria-label="Sections">
      <button type="button" class="tabbar-item" data-go="plan">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"></rect><path d="M8 9l1.5 1.5L12 8"></path><path d="M14 9.5h2.5"></path><path d="M8 15l1.5 1.5L12 14"></path><path d="M14 15.5h2.5"></path></svg>
        <span>Plan</span>
      </button>
      <button type="button" class="tabbar-item" data-go="studio">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"></path><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"></path></svg>
        <span>Recipes</span>
      </button>
    </nav>

    <dialog id="options-sheet" class="sheet-dialog" aria-labelledby="options-sheet-title">
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-head">
        <button type="button" class="text-btn" id="reset-options">Reset</button>
        <h2 id="options-sheet-title">Batch Options</h2>
        <button type="button" class="done-btn" id="close-options">Done</button>
      </div>
      <div id="options-phone" class="options"></div>
    </dialog>

    <script type="module" src="./src/app.js?v=20261102-wizard"></script>
  </body>
</html>
