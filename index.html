<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nerikiri 練り切り</title>
    <meta name="description" content="Plan nerikiri batches: base dough, color portions, filling and shaping, with totals that add up." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved appearance before the page paints.
      try { var t = localStorage.getItem("nerikiri-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
      document.documentElement.dataset.effective = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nerikiri" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&display=swap" />
    <link rel="stylesheet" href="./styles.css?v=20261103-yields" />
  </head>
  <body data-view="plan">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="tb-side">
          <button type="button" class="tb-btn" id="toggle-sidebar" aria-label="Show or hide sidebar" aria-pressed="true" title="Show or Hide Sidebar (⌃⌘S)">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3"></rect><path d="M9.5 4.5v15"></path></svg>
          </button>
          <div class="brand"><span class="brand-en">Nerikiri</span> <span class="brand-jp">練り切り</span></div>
        </div>
        <nav class="tabs" aria-label="App sections">
          <button type="button" class="tab" data-go="plan">Calculator</button>
          <button type="button" class="tab" data-go="studio">Recipe Studio</button>
        </nav>
        <div class="tb-side end">
          <button type="button" class="tb-btn theme-btn" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">
            <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"></path></svg>
            <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
          </button>
          <button type="button" class="tb-btn" id="toggle-inspector" aria-label="Show or hide batch settings" aria-pressed="true" title="Show or Hide Batch Settings (⌥⌘I)">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3"></rect><path d="M14.5 4.5v15"></path></svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <!-- Guided setup: one question per screen, shown on the first visit -->
      <section class="view" id="view-wizard" aria-labelledby="wiz-title" hidden>
        <div class="wizard">
          <div class="wiz-progress">
            <span id="wiz-count" class="hint"></span>
            <span class="wiz-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
            <button type="button" class="glass-circle theme-btn phone-only" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">
              <svg class="icon-sun" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"></path></svg>
              <svg class="icon-moon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
            </button>
          </div>
          <h1 id="wiz-title" class="wiz-title" tabindex="-1"></h1>
          <p id="wiz-help" class="wiz-help"></p>
          <div id="wiz-body" class="wiz-body"></div>
          <div class="wiz-nav">
            <button type="button" class="text-btn" id="wiz-back">Back</button>
            <button type="button" class="primary-btn" id="wiz-next">Next</button>
          </div>
        </div>
      </section>

      <!-- Calculator -->
      <section class="view" id="view-plan" aria-label="Calculator">
        <div class="plan-layout">
          <aside class="card sidebar" aria-labelledby="designs-title">
            <div class="panel-head">
              <h2 id="designs-title" class="panel-title">Designs</h2>
              <button type="button" class="icon-btn" id="sidebar-new" aria-label="New design" title="New design">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
              </button>
            </div>
            <div class="recipe-cards" id="recipe-cards" role="group" aria-labelledby="designs-title"></div>
          </aside>

          <section class="sheet" aria-label="Prep sheet">
            <div class="phone-header">
              <div class="phone-header-row">
                <label class="title-picker">
                  <span class="title-text" data-out="titleHtml"></span>
                  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
                  <select class="overlay-select" data-bind="recipeId" aria-label="Recipe"></select>
                </label>
                <span class="phone-actions">
                <button type="button" class="glass-circle theme-btn" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">
            <svg class="icon-sun" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"></path></svg>
            <svg class="icon-moon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
                </button>
                <button type="button" class="glass-circle" id="open-options" aria-label="Batch options">
                  <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h4"></path><path d="M12 17h8"></path><circle cx="10" cy="17" r="2"></circle></svg>
                </button>
                </span>
              </div>
              <p class="hint num" data-out="piecesLine"></p>
            </div>

            <div class="sheet-title">
              <h1 class="sheet-h1" data-out="titleHtml"></h1>
              <p class="hint num" data-out="piecesLine"></p>
            </div>
            <div class="answers">
              <span class="answers-line" data-out="answersLine"></span>
              <button type="button" class="secondary-btn" id="change-answers">Change</button>
            </div>
            <div class="summary" id="summary"></div>
            <div id="steps" class="steps"></div>
            <div id="totals"></div>
            <div id="minibatch"></div>
          </section>

          <aside class="card inspector" aria-labelledby="batch-title">
            <h2 id="batch-title" class="panel-title">Batch</h2>
            <div class="group">
              <label class="group-label" for="pieces-wide">Pieces</label>
              <div class="stepper stepper-large">
                <button type="button" class="step-btn" data-step="-1" aria-label="One fewer piece" title="One fewer piece">−</button>
                <input id="pieces-wide" class="num" type="number" inputmode="numeric" min="1" step="1" data-bind="pieces" />
                <button type="button" class="step-btn" data-step="1" aria-label="One more piece" title="One more piece">+</button>
              </div>
              <p class="hint num" data-out="piecesLine"></p>
            </div>
            <div class="group">
              <span class="group-label" id="loss-label">Extra for handling</span>
              <div class="chips" role="group" aria-labelledby="loss-label">
                <button type="button" class="chip-btn" data-set="loss" data-value="0">None</button>
                <button type="button" class="chip-btn" data-set="loss" data-value="5">5%</button>
                <button type="button" class="chip-btn" data-set="loss" data-value="10">10%</button>
                <button type="button" class="chip-btn" data-set="loss" data-value="15">15%</button>
              </div>
              <p class="hint">Covers coloring, shaping and sticky hands.</p>
            </div>
            <div id="options-wide" class="options"></div>
          </aside>
        </div>

        <div class="pieces-bar glass" aria-label="Batch size">
          <span class="pieces-bar-label" id="pieces-phone-label">Pieces</span>
          <div class="stepper">
            <button type="button" class="step-btn round" data-step="-1" aria-label="One fewer piece">−</button>
            <input class="num" type="number" inputmode="numeric" min="1" step="1" data-bind="pieces" aria-labelledby="pieces-phone-label" />
            <button type="button" class="step-btn round" data-step="1" aria-label="One more piece">+</button>
          </div>
          <label class="pill-select">
            <span class="visually-hidden">Extra dough for handling</span>
            <select data-bind="loss">
              <option value="0">No extra</option>
              <option value="5">+5%</option>
              <option value="10">+10%</option>
              <option value="15">+15%</option>
            </select>
          </label>
        </div>
      </section>

      <!-- Recipe Studio -->
      <section class="view" id="view-studio" aria-label="Recipe Studio" hidden>
        <div class="layout">
          <aside class="card library" aria-labelledby="library-title">
            <div class="library-head">
              <h1 id="library-title" class="display">Recipes</h1>
              <button type="button" class="glass-circle theme-btn phone-only" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">
              <svg class="icon-sun" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"></path></svg>
              <svg class="icon-moon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
            </button>
            </div>
            <div class="chips two" role="group" aria-label="Recipe type">
              <button type="button" class="chip-btn" data-lib="design">Designs</button>
              <button type="button" class="chip-btn" data-lib="base">Base doughs</button>
            </div>
            <button type="button" class="new-btn" id="new-recipe">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
              <span id="new-recipe-label">New design</span>
            </button>
            <div id="library-list" class="library-list"></div>
            <p class="hint device-note">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M10 18h4"></path></svg>
              Recipes save on this device, in this browser.
            </p>
            <div class="backup">
              <div class="backup-row">
                <button type="button" class="secondary-btn" id="export-backup">Export backup</button>
                <button type="button" class="secondary-btn" id="import-backup">Import backup</button>
                <input type="file" id="import-file" accept="application/json,.json,.txt" hidden />
              </div>
              <p class="hint" id="backup-status" aria-live="polite">Move your recipes to another browser or device.</p>
            </div>
          </aside>

          <form class="editor" id="recipe-form" novalidate></form>
        </div>
      </section>
    </main>

    <nav class="tabbar glass" aria-label="Sections">
      <button type="button" class="tabbar-item" data-go="plan">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"></rect><path d="M8 9l1.5 1.5L12 8"></path><path d="M14 9.5h2.5"></path><path d="M8 15l1.5 1.5L12 14"></path><path d="M14 15.5h2.5"></path></svg>
        <span>Plan</span>
      </button>
      <button type="button" class="tabbar-item" data-go="studio">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"></path><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"></path></svg>
        <span>Recipes</span>
      </button>
    </nav>

    <dialog id="options-sheet" class="sheet-dialog" aria-labelledby="options-sheet-title">
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-head">
        <button type="button" class="text-btn" id="reset-options">Reset</button>
        <h2 id="options-sheet-title">Batch Options</h2>
        <button type="button" class="done-btn" id="close-options">Done</button>
      </div>
      <div id="options-phone" class="options"></div>
    </dialog>

    <script type="module" src="./src/app.js?v=20261103-yields"></script>
  </body>
</html>
